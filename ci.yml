name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
  packages: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: apps/api/package.json }
      - run: npm install --no-audit --no-fund
        working-directory: apps/api
      - run: npm run typecheck
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: apps/web/package.json }
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: NEXT_PUBLIC_API_URL=/api npm run build
        working-directory: apps/web
  ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: apps/ai/requirements.txt }
      - run: pip install pytest 'pydantic>=2.7,<3'
      - run: python -m compileall -q apps/ai/app apps/ai/train.py
      - run: PYTHONPATH=apps/ai pytest -q apps/ai/tests
  containers:
    runs-on: ubuntu-latest
    needs: [api, web, ai-tests]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t onion-quality-api:test apps/api
      - run: docker build -t onion-quality-ai:test apps/ai
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=/api -t onion-quality-web:test apps/web
