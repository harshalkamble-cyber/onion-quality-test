apiVersion: v1
kind: Service
metadata: { name: ai, namespace: oniongrade }
spec:
  selector: { app: ai }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai, namespace: oniongrade }
spec:
  replicas: 1
  selector: { matchLabels: { app: ai } }
  template:
    metadata: { labels: { app: ai } }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: ai
          image: ghcr.io/REPLACE_ORG/onion-quality-ai:REPLACE_TAG
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: oniongrade-config } }]
          env:
            - { name: SERVICE_TOKEN, valueFrom: { secretKeyRef: { name: oniongrade-secret, key: AI_SERVICE_TOKEN } } }
          volumeMounts: [{ name: models, mountPath: /models, readOnly: true }]
          resources: { requests: { cpu: "1", memory: 2Gi }, limits: { cpu: "4", memory: 8Gi } }
          readinessProbe: { httpGet: { path: /health/ready, port: 8000 }, initialDelaySeconds: 60, periodSeconds: 15, failureThreshold: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: 8000 }, initialDelaySeconds: 30, periodSeconds: 20 }
          securityContext: { runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: models, persistentVolumeClaim: { claimName: models-pvc } }]
