apiVersion: v1
kind: Service
metadata: { name: redis, namespace: oniongrade }
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, namespace: oniongrade }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["sh","-c","exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\" --maxmemory 512mb --maxmemory-policy noeviction"]
          env: [{ name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: oniongrade-secret, key: REDIS_PASSWORD } } }]
          ports: [{ containerPort: 6379 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 1, memory: 768Mi } }
          readinessProbe: { exec: { command: ["sh","-c","redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"] }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { exec: { command: ["sh","-c","redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"] }, initialDelaySeconds: 20, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
