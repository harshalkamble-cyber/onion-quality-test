apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: restrict-internal-services, namespace: oniongrade }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: api } } }, { podSelector: { matchLabels: { app: worker } } }]
      ports: [{ protocol: TCP, port: 5432 }, { protocol: TCP, port: 6379 }]
    - from: [{ podSelector: { matchLabels: { app: api } } }, { podSelector: { matchLabels: { app: worker } } }]
      ports: [{ protocol: TCP, port: 8000 }]
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
      ports: [{ protocol: TCP, port: 3000 }, { protocol: TCP, port: 4000 }]
