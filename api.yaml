apiVersion: v1
kind: Service
metadata: { name: api, namespace: oniongrade }
spec:
  selector: { app: api }
  ports: [{ name: http, port: 4000, targetPort: 4000 }]
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: oniongrade }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: ghcr.io/REPLACE_ORG/onion-quality-api:REPLACE_TAG
          ports: [{ containerPort: 4000 }]
          envFrom: [{ configMapRef: { name: oniongrade-config } }, { secretRef: { name: oniongrade-secret } }]
          volumeMounts: [{ name: uploads, mountPath: /data/uploads }]
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "2", memory: 1Gi } }
          readinessProbe: { httpGet: { path: /health/ready, port: 4000 }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 4000 }, initialDelaySeconds: 20, periodSeconds: 20 }
          securityContext: { runAsNonRoot: true, runAsUser: 1001, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: uploads, persistentVolumeClaim: { claimName: uploads-pvc } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: oniongrade }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
